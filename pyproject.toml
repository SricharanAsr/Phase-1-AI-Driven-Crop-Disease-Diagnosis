[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-disease-pipeline"
version = "1.0.0"
authors = [
  { name="SricharanAsr", email="srmasc2006@gmail.com" },
]
description = "AI-Driven Crop Disease Diagnosis for Indian Agriculture"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "segment-anything-2",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/SricharanAsr/Phase-1-AI-Driven-Crop-Disease-Diagnosis"
"Bug Tracker" = "https://github.com/SricharanAsr/Phase-1-AI-Driven-Crop-Disease-Diagnosis/issues"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88
